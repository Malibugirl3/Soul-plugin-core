[dependencies]
services = [
  { name = "probe.model", version = ">=1,<2" },
  { name = "probe.tool", version = ">=1,<2" },
]

[provides]
services = [{ name = "probe.agent", version = "1.0" }]

[capabilities]
requests = ["events.publish"]
