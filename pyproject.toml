
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-plugin-core"
version = "0.1.0"
description = "A lightweight and extensible plugin core for long-running runtimes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jsonschema>=4.18",
    "packaging>=24",
    "referencing>=0.28.4",
    "tomli>=2.0; python_version < '3.11'",
    "typing_extensions>=4.13",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "setuptools>=77",
    "tomli>=2.0",
    "types-jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/Malibugirl3/Soul-plugin-core"
Repository = "https://github.com/Malibugirl3/Soul-plugin-core"
Issues = "https://github.com/Malibugirl3/Soul-plugin-core/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soul_plugin_core = ["py.typed"]
"soul_plugin_core.builtin" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = [
    "examples/m4_demo",
    "examples/plugin_types_demo",
    "examples/soulrt_probe",
    "src/soul_plugin_core/capabilities.py",
    "src/soul_plugin_core/builtin",
    "src/soul_plugin_core/config.py",
    "src/soul_plugin_core/composition.py",
    "src/soul_plugin_core/context.py",
    "src/soul_plugin_core/dependency.py",
    "src/soul_plugin_core/errors.py",
    "src/soul_plugin_core/events.py",
    "src/soul_plugin_core/extensions.py",
    "src/soul_plugin_core/host.py",
    "src/soul_plugin_core/instances.py",
    "src/soul_plugin_core/lifecycle.py",
    "src/soul_plugin_core/manifest.py",
    "src/soul_plugin_core/plugins.py",
    "src/soul_plugin_core/pipeline.py",
    "src/soul_plugin_core/services.py",
    "src/soul_plugin_core/selection.py",
    "tests/typecheck_m3a_handle.py",
    "tests/typecheck_manifest.py",
    "tests/typecheck_builtin_kv.py",
    "tests/typecheck_composition.py",
    "tests/typecheck_diagnostics.py",
    "tests/typecheck_extensions.py",
    "tests/typecheck_m3b_effects.py",
    "tests/typecheck_m3c_capabilities.py",
    "tests/typecheck_m4a_events.py",
    "tests/typecheck_plugin_types.py",
    "tests/typecheck_service_selection.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
